<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2979FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1867C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>
  <rect width="512" height="512" rx="100" ry="100" fill="url(#shine)"/>

  <!-- Left serif "I" -->
  <rect x="108" y="118" width="118" height="22" rx="6" fill="#ffffff"/>
  <rect x="152" y="140" width="30" height="212" fill="#ffffff"/>
  <rect x="108" y="352" width="118" height="22" rx="6" fill="#ffffff"/>

  <!-- Right serif "I" -->
  <rect x="286" y="118" width="118" height="22" rx="6" fill="#ffffff"/>
  <rect x="330" y="140" width="30" height="212" fill="#ffffff"/>
  <rect x="286" y="352" width="118" height="22" rx="6" fill="#ffffff"/>

</svg>
